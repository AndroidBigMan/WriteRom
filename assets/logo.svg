<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Chip Body Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Neon Accent Cyan to Emerald Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Glow Gradient for Filling Gauge -->
    <linearGradient id="gaugeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Warning / Max Capacity Glow -->
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.4" />

  <!-- Outer ROM Storage Gauge Track (Arc) -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#334155" stroke-width="18" stroke-linecap="round" opacity="0.6" />
  
  <!-- Storage Filled Arc (Progress representation ~88%) -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#gaugeGrad)" stroke-width="18" 
          stroke-dasharray="1080" stroke-dashoffset="260" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Hardware Chip Central Unit -->
  <g filter="url(#softShadow)">
    <rect x="136" y="136" width="240" height="240" rx="44" fill="url(#chipGrad)" stroke="#475569" stroke-width="3" />
    
    <!-- Chip Pins / Contacts -->
    <!-- Top Pins -->
    <rect x="176" y="118" width="16" height="18" rx="4" fill="#64748B" />
    <rect x="216" y="118" width="16" height="18" rx="4" fill="#64748B" />
    <rect x="256" y="118" width="16" height="18" rx="4" fill="#06B6D4" filter="url(#neonGlow)" />
    <rect x="296" y="118" width="16" height="18" rx="4" fill="#64748B" />
    <rect x="336" y="118" width="16" height="18" rx="4" fill="#64748B" />

    <!-- Bottom Pins -->
    <rect x="176" y="376" width="16" height="18" rx="4" fill="#64748B" />
    <rect x="216" y="376" width="16" height="18" rx="4" fill="#64748B" />
    <rect x="256" y="376" width="16" height="18" rx="4" fill="#10B981" filter="url(#neonGlow)" />
    <rect x="296" y="376" width="16" height="18" rx="4" fill="#64748B" />
    <rect x="336" y="376" width="16" height="18" rx="4" fill="#64748B" />

    <!-- Left Pins -->
    <rect x="118" y="176" width="18" height="16" rx="4" fill="#64748B" />
    <rect x="118" y="216" width="18" height="16" rx="4" fill="#64748B" />
    <rect x="118" y="256" width="18" height="16" rx="4" fill="#3B82F6" filter="url(#neonGlow)" />
    <rect x="118" y="296" width="18" height="16" rx="4" fill="#64748B" />
    <rect x="118" y="336" width="18" height="16" rx="4" fill="#64748B" />

    <!-- Right Pins -->
    <rect x="376" y="176" width="18" height="16" rx="4" fill="#64748B" />
    <rect x="376" y="216" width="18" height="16" rx="4" fill="#64748B" />
    <rect x="376" y="256" width="18" height="16" rx="4" fill="#06B6D4" filter="url(#neonGlow)" />
    <rect x="376" y="296" width="18" height="16" rx="4" fill="#64748B" />
    <rect x="376" y="336" width="18" height="16" rx="4" fill="#64748B" />

    <!-- Chip Core Inner Plate -->
    <rect x="156" y="156" width="200" height="200" rx="32" fill="#0B132B" stroke="#1E293B" stroke-width="2" />

    <!-- High-Speed Data Write Dynamic Arrow Icon -->
    <g transform="translate(256, 240)">
      <!-- Downward Write Chevron Array -->
      <path d="M-42 -36 L0 6 L42 -36" fill="none" stroke="#3B82F6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />
      <path d="M-48 -10 L0 38 L48 -10" fill="none" stroke="#06B6D4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
      
      <!-- ROM Flash Memory Stack / Blocks Icon -->
      <rect x="-38" y="52" width="76" height="12" rx="4" fill="#10B981" filter="url(#neonGlow)" />
      <rect x="-38" y="68" width="76" height="12" rx="4" fill="#10B981" opacity="0.6" />
      <rect x="-38" y="84" width="76" height="12" rx="4" fill="#64748B" opacity="0.3" />
    </g>

    <!-- Circuit Connection Traces -->
    <circle cx="180" cy="180" r="5" fill="#06B6D4" />
    <line x1="180" y1="180" x2="200" y2="180" stroke="#06B6D4" stroke-width="2" opacity="0.6" />
    
    <circle cx="332" cy="180" r="5" fill="#10B981" />
    <line x1="332" y1="180" x2="312" y2="180" stroke="#10B981" stroke-width="2" opacity="0.6" />

    <circle cx="180" cy="332" r="5" fill="#3B82F6" />
    <line x1="180" y1="332" x2="200" y2="332" stroke="#3B82F6" stroke-width="2" opacity="0.6" />

    <circle cx="332" cy="332" r="5" fill="#F43F5E" />
    <line x1="332" y1="332" x2="312" y2="332" stroke="#F43F5E" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Brand Typography -->
  <text x="256" y="468" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#F8FAFC" letter-spacing="4">
    ROM FILLER
  </text>
  <text x="256" y="492" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#06B6D4" letter-spacing="2">
    STRESS TEST SUITE
  </text>
</svg>
